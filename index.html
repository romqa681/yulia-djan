        * {

        }

        }
        
        .container {

            position: relative;
            overflow: hidden;

        .heart-title {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 5px;
            animation: heartbeat 1.5s ease infinite;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }

        h1 {
            text-align: center;
            color: #4a1a7a;
            margin-bottom: 5px;
            font-size: 1.8em;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-style: italic;
            font-size: 0.95em;
        }
        
        .progress-container {
            margin-bottom: 25px;
        }
        
        .progress-bar {
            height: 6px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 0.5s ease;
            width: 0%;
        }
        
        .progress-text {
            text-align: center;
            font-size: 0.85em;
            color: #999;
        }
        
        .question-card {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .question-card.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .question-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 12px;
            font-weight: bold;

        .badge-fun { background: #d5f5e3; color: #1e8449; }
        .badge-hot { background: #fadbd8; color: #c0392b; }

        }

            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            font-size: 0.95em;
            color: #555;
            position: relative;

        .option:hover {
            border-color: #764ba2;
            background: #f8f5ff;
            transform: translateX(5px);
        }

            border-color: #764ba2;
            background: #764ba2;
            color: white;
            font-weight: bold;
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);

            padding: 15px;
            border: 2px dashed #d0c4e8;
            border-radius: 12px;
            font-size: 1em;
            font-family: 'Georgia', serif;
            margin-top: 10px;
            display: none;
            transition: all 0.3s ease;
            background: #faf8ff;
        }
        
        .custom-input.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        .custom-input:focus {
            outline: none;
            border-color: #764ba2;
            border-style: solid;
            background: white;
        }

            justify-content: space-between;
            margin-top: 25px;
            gap: 12px;

            border-radius: 50px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;

        }

        }

            cursor: not-allowed;

            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;

            color: white;

                card.dataset.question = q.id;
                if (q.id === 1) card.classList.add('active');
                
                let optionsHTML = q.options.map((opt, i) => {
                    const isCustom = i === q.options.length - 1;
                    return `<div class="option" onclick="selectOption(this, 'question${q.id}', ${isCustom})">${opt}</div>`;
                }).join('');
                
                card.innerHTML = `
                    <span class="question-badge ${q.badge}">${q.badgeText}</span>
                    <p class="question-text">${q.question}</p>
                    <div class="options">${optionsHTML}</div>
                    <input type="text" class="custom-input" id="custom-question${q.id}" placeholder="Напиши свой вариант...">

                customInput.classList.add('show');
                customInput.focus();
                selectedOptions[questionId] = 'custom';
            } else {
                customInput.classList.remove('show');
                selectedOptions[questionId] = element.textContent.trim();
            }
        }

        function getAnswer(questionNum) {
            const questionId = `question${questionNum}`;
            const customInput = document.getElementById(`custom-${questionId}`);
            
            if (selectedOptions[questionId] === 'custom') {
                return customInput.value.trim() || '(свой вариант не заполнен)';
            }
            return selectedOptions[questionId] || '(ответ не выбран)';
        }

        function showQuestion(num) {
            document.querySelectorAll('.question-card').forEach(card => card.classList.remove('active'));
            const targetCard = document.querySelector(`[data-question="${num}"]`);
            if (targetCard) {
                targetCard.classList.add('active');
                currentQuestion = num;
                updateProgress();
                document.getElementById('app').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function nextQuestion() {
            if (!selectedOptions[`question${currentQuestion}`]) {
                showToast('Джан, выбери вариант ответа! 💜', 'error');
                return;
            }
            
            if (selectedOptions[`question${currentQuestion}`] === 'custom') {
                const customInput = document.getElementById(`custom-question${currentQuestion}`);
                if (!customInput.value.trim()) {
                    showToast('Напиши свой вариант! Не стесняйся 🤗', 'error');
                    return;
                }
            }
            
            if (currentQuestion < totalQuestions) {
                showQuestion(currentQuestion + 1);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 1) {
                showQuestion(currentQuestion - 1);
            }
        }

        function updateProgress() {
            const progress = (currentQuestion / totalQuestions) * 100;
            document.getElementById('progress').style.width = progress + '%';
            document.getElementById('progress-text').textContent = `Вопрос ${currentQuestion} из ${totalQuestions}`;
        }

        async function submitAnswers() {
            if (!selectedOptions[`question${currentQuestion}`]) {
                showToast('Ответь на последний вопрос, джан! 🌟', 'error');
                return;
            }
            
            if (selectedOptions[`question${currentQuestion}`] === 'custom') {
                const customInput = document.getElementById(`custom-question${currentQuestion}`);
                if (!customInput.value.trim()) {
                    showToast('Напиши финальное слово! ✍️', 'error');
                    return;
                }
            }

            const submitBtn = document.querySelector('.btn-submit');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Отправляю... 💫';
            }

            // Собираем ответы
            const results = [];
            questionsData.forEach(q => {
                results.push(`${q.id}. ${q.question}\n➡️ ${getAnswer(q.id)}`);
            });

            const message = `💌 *НОВЫЕ ОТВЕТЫ ОТ ЮЛИ ДЖАН! (20 вопросов)*\n\n${results.join('\n\n')}\n\n🕐 ${new Date().toLocaleString('ru-RU')}\n💜 С любовью, твоя анкета`;

            // Отправка в Telegram
            let sent = false;
            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
                
                const data = await response.json();
                sent = data.ok;
                if (!sent) console.error('Ошибка API:', data);
            } catch (e) {
                console.error('Ошибка отправки:', e);
            }

            // Показываем результат
            document.getElementById('questions-area').style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            const successDiv = document.getElementById('success');
            successDiv.classList.add('show');
            
            const statusText = successDiv.querySelector('p');
            if (sent) {
                statusText.textContent = 'Твои ответы уже летят к Роме в Telegram! 📲';
                statusText.style.color = '#27ae60';
                if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
            } else {
                statusText.textContent = 'Не удалось отправить автоматически, но вот резервная копия:';
                statusText.style.color = '#e67e22';
                const backupNote = document.createElement('div');
                backupNote.style.cssText = 'margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 10px; text-align: left;';
                backupNote.innerHTML = `
                    <p style="font-weight:bold;margin-bottom:10px;">📋 Скопируй и отправь Роме вручную:</p>
                    <textarea readonly style="width:100%;height:200px;border-radius:8px;border:1px solid #ddd;padding:10px;font-size:0.8em;">${message.replace(/\*/g, '')}</textarea>
                    <p style="margin-top:10px;font-size:0.9em;">Отправь это @romqa68 👆</p>
                `;
                successDiv.appendChild(backupNote);
            }
            
            createSparkles();
        }

        function createSparkles() {
            const sparklesContainer = document.getElementById('sparkles');
            const emojis = ['💜', '✨', '💕', '🌟', '💫', '💝', '🥰', '💖', '🔥', '🌶️', '🙈', '💋'];
            
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('span');
                    sparkle.className = 'sparkle';
                    sparkle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    sparkle.style.left = Math.random() * 100 + '%';
                    sparkle.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    sparkle.style.fontSize = (Math.random() * 2.5 + 1) + 'em';
                    sparklesContainer.appendChild(sparkle);
                    setTimeout(() => sparkle.remove(), 4000);
                }, i * 80);
            }
        }

        // Свайпы
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });
        
        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > 100) {
                if (diff > 0 && currentQuestion < totalQuestions) {
                    nextQuestion();
                } else if (diff < 0 && currentQuestion > 1) {
                    prevQuestion();
                }
            }
        });

        // Инициализация
        generateQuestions();
        updateProgress();
        console.log('💜 Анкета для Юли Джан готова! 20 вопросов.');
        console.log('📲 Ответы придут на Telegram:', YOUR_TELEGRAM);
    </script>
</body>
</html>
